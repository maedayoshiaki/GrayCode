[project]
name = "graycode"
version = "0.1.0"
description = "Projector–camera gray-code geometric calibration and image warping"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.4",
    "opencv-contrib-python>=4.11.0.86",
    "scipy>=1.16.3",
    "torch>=2.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graycode"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
